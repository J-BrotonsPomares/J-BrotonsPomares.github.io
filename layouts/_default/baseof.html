<!doctype html><html lang="{{ site.Language.LanguageCode }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}"><meta name="theme-color" content="#071b2d"><title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Params.author }}{{ end }}</title>{{ $css := resources.Get "css/main.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ $css.RelPermalink }}"></head><body><a class="skip" href="#main">Saltar al contenido</a>{{ partial "header.html" . }}<main id="main">{{ block "main" . }}{{ end }}</main>{{ partial "footer.html" . }}</body></html>
